<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Администратор — Корочки.есть</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="container">
    <h1>Панель администратора</h1>

    <!-- Блок при отсутствии прав -->
    <div id="accessWarn" style="display:none">
      <p>Доступ запрещён.</p>
      <a href="/login">Войти</a>
    </div>

    <!-- Основной контент -->
    <div id="content" style="display:none">
      <h2>Все заявки</h2>

      <div style="overflow-x:auto">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Логин</th>
              <th>Курс</th>
              <th>Дата</th>
              <th>Оплата</th>
              <th>Статус</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="applicationsTable"></tbody>
        </table>
      </div>

      <p id="message" class="msg"></p>
    </div>
  </div>

  <script>
    // ========================
    // ПРОВЕРКА ПРАВ ДОСТУПА
    // ========================
    const userRole = localStorage.getItem("role");

    if (userRole !== "admin") {
      // Нет прав - показываем предупреждение
      document.getElementById("accessWarn").style.display = "block";
    } else {
      // Есть права - показываем панель
      document.getElementById("content").style.display = "block";

      // ========================
      // ОТРИСОВКА ТАБЛИЦЫ
      // ========================
      function renderApplicationsTable(applications) {
        const tableBody = document.getElementById("applicationsTable");

        // Если заявок нет
        if (!applications.length) {
          tableBody.innerHTML = "<tr><td colspan='7'>Заявок нет</td></tr>";
          return;
        }

        // Создаём строки для каждой заявки
        const rowsHtml = applications.map(function (app) {
          return `
            <tr>
              <td>${app.id}</td>
              <td>${app.user_login}</td>
              <td>${app.course_name}</td>
              <td>${app.start_date}</td>
              <td>${app.payment_method}</td>
              <td>
                <select class="statusSelect" data-id="${app.id}">
                  <option ${app.status === "Новая" ? "selected" : ""}>Новая</option>
                  <option ${app.status === "Идёт обучение" ? "selected" : ""}>Идёт обучение</option>
                  <option ${app.status === "Обучение завершено" ? "selected" : ""}>Обучение завершено</option>
                </select>
              </td>
              <td>
                <button class="saveButton" data-id="${app.id}">Сохранить</button>
              </td>
            </tr>
          `;
        }).join("");

        tableBody.innerHTML = rowsHtml;

        // ========================
        // НАСТРОЙКА КНОПОК СОХРАНЕНИЯ
        // ========================
        const allSaveButtons = document.querySelectorAll(".saveButton");

        allSaveButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            const applicationId = button.dataset.id;

            // Находим соответствующий select для этой заявки
            const selectElement = document.querySelector(
              `.statusSelect[data-id="${applicationId}"]`
            );
            const newStatus = selectElement.value;

            // Отправляем запрос на сервер
            try {
              const response = await fetch(
                `/api/admin/applications/${applicationId}/status`,
                {
                  method: "PATCH",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ status: newStatus })
                }
              );

              const result = await response.json();
              const messageElement = document.getElementById("message");

              if (response.ok) {
                messageElement.textContent = "Статус обновлён.";
                messageElement.className = "msg ok";
              } else {
                messageElement.textContent = result.error || "Ошибка при обновлении.";
                messageElement.className = "msg error";
              }
            } catch (error) {
              const messageElement = document.getElementById("message");
              messageElement.textContent = "Ошибка соединения с сервером.";
              messageElement.className = "msg error";
            }
          });
        });
      }

      // ========================
      // ЗАГРУЗКА ДАННЫХ С СЕРВЕРА
      // ========================
      async function loadApplications() {
        try {
          const response = await fetch("/api/admin/applications");
          const data = await response.json();
          const messageElement = document.getElementById("message");

          if (!response.ok) {
            messageElement.textContent = data.error || "Ошибка загрузки.";
            messageElement.className = "msg error";
            return;
          }

          renderApplicationsTable(data.applications || []);

        } catch (error) {
          const messageElement = document.getElementById("message");
          messageElement.textContent = "Ошибка соединения с сервером.";
          messageElement.className = "msg error";
        }
      }

      // Запускаем загрузку при открытии страницы
      loadApplications();
    }
  </script>
</body>

</html>
