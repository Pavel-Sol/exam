<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои заявки — Корочки.есть</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="container">
    <h1>Мои заявки</h1>

    <!-- Блок при отсутствии авторизации -->
    <div id="authWarn" style="display:none">
      <p>Требуется авторизация.</p>
      <a href="/login">Войти</a>
    </div>

    <!-- Основной контент (виден только авторизованным) -->
    <div id="content" style="display:none">
      <h2>Список заявок</h2>

      <div style="overflow-x:auto">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Курс</th>
              <th>Дата начала</th>
              <th>Оплата</th>
              <th>Статус</th>
              <th>Дата создания</th>
            </tr>
          </thead>
          <tbody id="applicationsList"></tbody>
        </table>
      </div>

      <p>
        <a href="/create_application">+ Новая заявка</a>
      </p>

      <!-- Блок с отзывом -->
      <div class="card">
        <h2>Отзыв о курсе</h2>
        <div id="reviewStatus" class="msg"></div>

        <form id="reviewForm">
          <div class="field">
            <label for="reviewText">Текст отзыва</label>
            <textarea id="reviewText" placeholder="Введите отзыв" disabled></textarea>
          </div>

          <div class="actions">
            <button id="reviewSubmit" type="submit" disabled>
              Отправить отзыв
            </button>
          </div>

          <p id="reviewMessage" class="msg"></p>
        </form>
      </div>

      <p id="generalMessage" class="msg"></p>
    </div>
  </div>

  <script>
    // Получаем ID пользователя из localStorage
    const userId = localStorage.getItem("user_id");

    // Проверка авторизации
    if (!userId) {
      document.getElementById("authWarn").style.display = "block";
    } else {
      document.getElementById("content").style.display = "block";

      // Загрузка заявок с сервера
      async function load() {
        const response = await fetch("/api/applications/my?user_id=" + userId);
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          document.getElementById("generalMessage").textContent = data.error || "Ошибка.";
          return;
        }

        const applications = data.applications || [];
        const tableBody = document.getElementById("applicationsList");

        // Отрисовка таблицы заявок
        tableBody.innerHTML = applications.length
          ? applications.map(app => `
            <tr>
              <td>${app.id}</td>
              <td>${app.course_name}</td>
              <td>${app.start_date}</td>
              <td>${app.payment_method}</td>
              <td>${app.status}</td>
              <td>${app.created_at}</td>
             </tr>
          `).join("")
          : "<tr><td colspan='6'>Заявок нет</td></tr>";

        // Проверка, можно ли оставлять отзыв (есть ли завершённые курсы)
        const hasCompleted = applications.some(app => app.status === "Обучение завершено");

        const reviewStatusDiv = document.getElementById("reviewStatus");
        const reviewTextarea = document.getElementById("reviewText");
        const reviewButton = document.getElementById("reviewSubmit");

        if (hasCompleted) {
          reviewStatusDiv.className = "msg ok";
          reviewStatusDiv.textContent = "Курс завершён. Можно оставить отзыв.";
          reviewTextarea.disabled = false;
          reviewButton.disabled = false;
        } else {
          reviewStatusDiv.className = "msg error";
          reviewStatusDiv.textContent = "Отзыв доступен только после завершения курса.";
          document.getElementById("reviewForm").classList.add("is-locked");
        }
      }

      load();

      // Отправка отзыва
      document.getElementById("reviewForm").addEventListener("submit", async event => {
        event.preventDefault();

        const text = document.getElementById("reviewText").value.trim();
        if (!text) return;

        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: Number(userId),
            text: text
          })
        });

        const result = await response.json().catch(() => ({}));
        const reviewMessage = document.getElementById("reviewMessage");

        reviewMessage.textContent = response.ok ? "Отзыв отправлен." : result.error || "Ошибка.";
        reviewMessage.className = response.ok ? "msg ok" : "msg error";

        if (response.ok) {
          document.getElementById("reviewText").value = "";
        }
      });
    }
  </script>
</body>

</html>
